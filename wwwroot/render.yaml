services:
  - type: web
    name: rng-villas
    runtime: docker
    plan: free
    buildCommand: docker build -t rng-villas .
    startCommand: docker run -p 8080:8080 rng-villas
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false  # We'll set this manually
      - key: EmailSettings__Password
        sync: false  # We'll set this manually